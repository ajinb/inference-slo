[project]
name = "inference-slo"
version = "0.1.0"
description = "SLO-aware admission control for LLM inference serving — a deterministic replay harness showing what to shed, when, and against which SLO, when accelerators saturate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["llm", "inference", "kubernetes", "slo", "admission-control", "load-shedding",
            "vllm", "gateway-api", "sre"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/inference-slo"

[project.scripts]
inference-slo = "inference_slo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_slo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
